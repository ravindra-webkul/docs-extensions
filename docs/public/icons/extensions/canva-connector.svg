<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC"/>
      <stop offset="55%" stop-color="#5B4BE8"/>
      <stop offset="100%" stop-color="#7D2AE8"/>
    </linearGradient>
    <filter id="cc-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="48" height="48" rx="12" fill="url(#cc-bg)"/>

  <!-- Subtle canvas shape behind the symbol -->
  <rect x="9" y="13" width="30" height="22" rx="3.5" fill="#ffffff" opacity="0.10"/>

  <!-- Image frame -->
  <rect
    x="9"
    y="13"
    width="30"
    height="22"
    rx="3.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.4"
    filter="url(#cc-sh)"
  />

  <!-- Sun -->
  <circle cx="16" cy="20" r="2.3" fill="#ffffff"/>

  <!-- Design sparkle -->
  <path
    d="M32 16 L33.1 18.9 L36 20 L33.1 21.1 L32 24 L30.9 21.1 L28 20 L30.9 18.9 Z"
    fill="#ffffff"
    opacity="0.95"
  />

  <!-- Mountain horizon -->
  <polyline
    points="12.5,31 19,23.5 23.5,28 28.5,21.5 35.5,31"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
